# The Xfce session, a unit of tester's user manager, runs on the X server of
# e2e-desktop.service. The commands run as root outside the logind session
# (+) and reach the user manager as tester.
[Service]
ExecStartPost=+/usr/sbin/runuser -u tester -- env XDG_RUNTIME_DIR=/run/user/1000 systemctl --user start xfce4-session.service
# Xfce ends with its X server, as at a logout. A stop request while the X
# server runs waits on it: Xfce 4.20 does not end on SIGTERM then.
ExecStopPost=+-/usr/sbin/runuser -u tester -- env XDG_RUNTIME_DIR=/run/user/1000 sh -c 'systemctl --user stop xfce4-session.service; systemctl --user reset-failed xfce4-session.service'
