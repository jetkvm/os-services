# For the X server without a desktop. Xorg sets up the screens that are
# connected when it starts and never turns on one that appears later; a
# desktop's display daemon would. The KVM's screen disconnects for a moment
# each time the KVM changes its EDID, for example when e2e restores the
# KVM's resolution after a target, so Xorg starts only once a screen is
# connected, and the start fails after 10 s without one.
[Service]
ExecStartPre=+/bin/sh -c 'i=0; until grep -qx connected /sys/class/drm/card*-*/status; do [ $$i -lt 100 ] || { echo "no screen is connected" >&2; exit 1; }; i=$$((i + 1)); sleep 0.1; done'
